<style>
:root{--bg:#FBF7F0;--sand:#E9DEC8;--ink:#2B2118;--mut:#7A6A55;--acc:#2F4A3A;--wa:#25D366}
*{box-sizing:border-box;margin:0}
html{background:#d9d2c3}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);max-width:430px;margin:0 auto;position:relative;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
img{display:block;width:100%;height:100%;object-fit:cover}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:400;line-height:1.06;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:32px}
.mut{color:var(--mut);font-size:14px;line-height:1.45}
.btn{display:block;text-align:center;text-decoration:none;font-weight:600;font-size:16px;padding:17px 0;border-radius:999px;color:#fff;background:var(--acc);transition:transform .15s ease}
.btn:active{transform:scale(.97)}
.btn.wa{background:var(--wa);color:#06361a}
a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.pad{padding:72px 20px}
.ph,.pic,.tile,.house,.map{outline:1px solid rgba(0,0,0,.07);outline-offset:-1px}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

.hero{position:relative;height:100svh;min-height:600px;color:#fff;overflow:hidden}
.hero>img{position:absolute;inset:0;transform:scale(1.08);animation:zoom 14s ease-out forwards}
@keyframes zoom{to{transform:scale(1)}}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.05) 24%,rgba(18,12,6,.35) 42%,rgba(18,12,6,.86) 62%,rgba(18,12,6,.96))}
.top{position:absolute;z-index:2;top:max(18px,env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:Fraunces,serif;font-size:21px;line-height:1}
.logo small{display:block;font:600 10px Inter,sans-serif;letter-spacing:.32em;margin-top:5px;opacity:.85}
.lang{font:600 12px Inter,sans-serif;color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:9px 14px;background:none}
.hb{position:absolute;z-index:2;left:20px;right:20px;bottom:22px}
.hero h1{font-size:42px;margin-bottom:18px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:16px;font-size:12px;border-top:1px solid rgba(255,255,255,.3)}
.nums span{padding:12px 0 0;padding-inline-start:12px;border-inline-start:1px solid rgba(255,255,255,.3)}
.nums span:first-child{padding-inline-start:0;border-inline-start:0}
.nums b{display:block;font-family:Fraunces,serif;font-weight:500;font-size:22px;margin-bottom:2px;white-space:nowrap}
.dates{display:grid;grid-template-columns:1fr 1fr 74px;background:#fff;border-radius:18px;margin-bottom:10px;color:var(--ink)}
.dates label{display:block;padding:9px 12px 8px;font-size:11px;font-weight:600;color:var(--mut);border-inline-start:1px solid var(--sand);min-width:0}
.dates label:first-child{border-inline-start:0}
.dates input,.dates select{display:block;width:100%;border:0;background:none;font:500 14px Inter,sans-serif;color:var(--ink);padding:3px 0 0;margin:0;-webkit-appearance:none;appearance:none;min-height:22px}
.note{text-align:center;font-size:13px;font-weight:500;margin-top:13px;opacity:.92}

.fly{height:240svh;position:relative}
.fly .st{position:sticky;top:0;height:100svh;overflow:hidden;padding:40px 20px 0}
.stage{position:absolute;left:20px;right:20px;top:136px;bottom:28px}
.tile{position:absolute;border-radius:14px;overflow:hidden;will-change:transform,opacity}
.t1{left:0;top:0;width:48%;height:30%}
.t2{right:0;top:6%;width:36%;height:40%}
.t3{left:3%;top:56%;width:38%;height:36%}
.t4{right:0;top:64%;width:44%;height:34%}
.main{z-index:2;inset-inline-start:31%;border-radius:16px;box-shadow:0 0 0 4px var(--bg)}
.amen{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;padding:8px 20px 0}
.amen div{display:flex;gap:11px;align-items:center;font-size:14px;font-weight:500;line-height:1.25}
.amen svg{width:23px;height:23px;flex:none;stroke:var(--acc);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.apt{padding:76px 0 72px}
.apt h2{padding:0 20px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:22px 20px 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar,.gal2::-webkit-scrollbar{display:none}
.tabs button{flex:none;font:500 14px Inter,sans-serif;color:var(--ink);background:var(--sand);border:0;border-radius:999px;padding:12px 17px;transition:background .25s ease,color .25s ease}
.tabs button.on{background:var(--ink);color:#fff}
.gal2{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 20px;scroll-padding:0 20px;scrollbar-width:none;transition:opacity .25s ease}
.gal2 img{flex:0 0 86%;width:86%;height:auto;aspect-ratio:4/5;border-radius:18px;scroll-snap-align:start;outline:1px solid rgba(0,0,0,.07);outline-offset:-1px}
.bf{display:flex;align-items:center;gap:12px;margin-top:16px;padding:15px 16px;background:var(--sand);border-radius:16px;font-size:14px;font-weight:500}
.bf input{width:22px;height:22px;accent-color:var(--acc);flex:none;margin:0}
.bf b{margin-inline-start:auto;font-weight:600;white-space:nowrap}
.cnt{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);padding:12px 20px 0}
.atx{padding:16px 20px 0}
.atx h3{font-family:Fraunces,serif;font-weight:500;font-size:26px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.facts span{font-size:13px;font-weight:500;background:var(--sand);border-radius:999px;padding:6px 12px;color:var(--ink)}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.pr b{font-family:Fraunces,serif;font-weight:500;font-size:34px}
.pr .btn{padding:15px 26px;font-size:15px}

.map{position:relative;height:300px;border-radius:20px;overflow:hidden;margin:24px 0 0;background:#DDE5DA}
.map iframe{width:100%;height:100%;border:0;filter:saturate(.75)}
.map a{position:absolute;inset-inline-start:12px;bottom:12px;background:#fff;color:var(--ink);font:600 13px Inter,sans-serif;text-decoration:none;padding:11px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.16)}
.big{display:grid;grid-template-columns:repeat(3,1fr);margin-top:26px}
.big span{font-size:13px;color:var(--mut);padding-inline-start:14px;border-inline-start:1px solid var(--sand)}
.big span:first-child{padding-inline-start:0;border-inline-start:0}
.big b{display:block;font-family:Fraunces,serif;font-weight:400;font-size:34px;color:var(--ink);line-height:1.05;margin-bottom:4px}
.big small{font-size:15px}
.mallrow{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:24px;padding:16px 18px;background:var(--sand);border-radius:18px;text-decoration:none;color:var(--ink)}
.mallrow b{display:block;font-family:Fraunces,serif;font-weight:500;font-size:20px}
.mallrow span{font-size:13px;color:var(--mut)}
.mallrow i{font-style:normal;font-weight:600;font-size:13px;white-space:nowrap}

.terms{background:var(--sand);padding:72px 20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 0 8px}
.two div{background:var(--bg);border-radius:18px;padding:18px 16px 20px;font-size:13px;color:var(--mut)}
.two b{display:block;font-family:Fraunces,serif;font-weight:400;font-size:26px;line-height:1.05;color:var(--ink);margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid rgba(43,33,24,.12);font-size:15px}
.row b{font-weight:500}.row span{color:var(--mut);text-align:end}
.row:last-child{border-bottom:0}

.end{background:var(--acc);color:#fff;padding:76px 20px 20px}
.end h2{font-size:40px}
.end .mut{color:#cfe0d4;margin:16px 0 26px}
.end .tel{display:block;text-align:center;color:#fff;font-weight:500;font-size:16px;margin:18px 0 32px;text-decoration:none}
.end .pic{height:300px;border-radius:20px;overflow:hidden}
.foot{margin-top:34px;padding:26px 0 76px;border-top:1px solid rgba(255,255,255,.2);font-size:14px;line-height:1.6;color:#cfe0d4}
.foot .logo{color:#fff;margin-bottom:16px}
.foot a{color:#fff;text-decoration:none;font-weight:500}
.foot .ln{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0}
.foot small{display:block;font-size:12px;opacity:.75;margin-top:14px}
.fab{position:fixed;z-index:9;bottom:max(16px,env(safe-area-inset-bottom));right:max(16px,calc(50% - 199px));width:56px;height:56px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.22);transform:scale(0);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.fab.show{transform:scale(1)}
.fab svg{width:30px;height:30px;fill:#fff}
[dir=rtl] body{font-family:'IBM Plex Sans Arabic',Inter,sans-serif}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .atx h3,[dir=rtl] .mallrow b,[dir=rtl] .two b{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:500;letter-spacing:0;line-height:1.3}

[dir=rtl] .btn,[dir=rtl] .lang,[dir=rtl] .dates input,[dir=rtl] .dates select,[dir=rtl] .tabs button{font-family:'IBM Plex Sans Arabic',sans-serif}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.hero>img{animation:none;transform:none}}
</style>

const SRC={balkon:'img/balkon.jpg',fasad2:'img/fasad2.jpg',finiki:'img/finiki.jpg',g_1br:'img/g_1br.jpg',g_c:'img/g_c.jpg',hero:'img/hero.jpg',kuh:'img/kuh.jpg',s_1br:'img/s_1br.jpg',seif:'img/seif.jpg',spal:'img/spal.jpg',spal2:'img/spal2.jpg',van:'img/van.jpg',m_gost:'img/m_gost.jpg',m_vid:'img/m_vid.jpg',m_kuh:'img/m_kuh.jpg',m_twin:'img/m_twin.jpg',m_dbl:'img/m_dbl.jpg',m_van:'img/m_van.jpg',a_gost:'img/a_gost.jpg',a_kuh:'img/a_kuh.jpg',a_van:'img/a_van.jpg',a_spal:'img/a_spal.jpg',b_kuh:'img/b_kuh.jpg',b_van:'img/b_van.jpg'};document.querySelectorAll('img[data-s]').forEach(i=>i.src=SRC[i.dataset.s]);
let L='en';const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const prog=el=>{const r=el.getBoundingClientRect();return clamp(-r.top/(r.height-innerHeight))};
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));

const fly=$('fly'),tiles=[...fly.querySelectorAll('.tile:not(.main)')],main=fly.querySelector('.main'),lerp=(a,b,t)=>a+(b-a)*t;
function drawFly(){
  const p=calm?1:prog(fly),q=clamp(p/.8),e=q*q*(3-2*q),rtl=L==='ar'?-1:1;
  tiles.forEach(t=>{t.style.transform=`translate(${t.dataset.x*e*rtl}%,${t.dataset.y*e}%) scale(${1-.2*e})`;t.style.opacity=1-e*1.2});
  main.style.insetInlineStart=lerp(31,0,e)+'%';main.style.top=lerp(30,0,e)+'%';main.style.width=lerp(36,100,e)+'%';main.style.height=lerp(30,100,e)+'%';
}

const apts=[
 {t:'one',x:'x1',p:45,g:['a_gost','a_spal','a_kuh','a_van']},
 {t:'oneb',x:'x1',p:45,g:['g_1br','s_1br','b_kuh','b_van']},
 {t:'two',x:'x2',p:85,g:['m_gost','m_twin','m_dbl','m_kuh','m_van','m_vid']},
 {t:'two2',x:'x2',p:85,g:['hero','g_c','spal','spal2','kuh','van','balkon']}];
const gal=$('gal'),tabs=[...document.querySelectorAll('#tabs button')];let cur=2;
function cnt(){const w=gal.firstChild?gal.firstChild.offsetWidth+10:1,i=Math.min(apts[cur].g.length-1,Math.round(Math.abs(gal.scrollLeft)/w));$('cnt').textContent=(i+1)+' / '+apts[cur].g.length}
function fillCard(){const f=apts[cur],t=T[L];
  gal.innerHTML=f.g.map(n=>`<img src="${SRC[n]}" alt="">`).join('');gal.scrollLeft=0;
  $('ct').textContent=t[f.t];$('cf').innerHTML=t[f.x].map(x=>`<span>${x}</span>`).join('');$('cp').textContent='$'+f.p;bf();
  tabs.forEach(c=>c.classList.toggle('on',+c.dataset.i===cur));cnt();links();}
gal.addEventListener('scroll',cnt,{passive:true});
tabs.forEach(c=>c.onclick=()=>{cur=+c.dataset.i;gal.style.opacity=0;setTimeout(()=>{fillCard();gal.style.opacity=1},calm?0:160)});

const ci=$('ci'),co=$('co'),gs=$('gs'),iso=d=>d.toISOString().slice(0,10),day=864e5;
gs.innerHTML=Array.from({length:20},(_,i)=>`<option${i===1?' selected':''}>${i+1}</option>`).join('');ci.min=iso(new Date());co.min=iso(new Date(Date.now()+day));
ci.onchange=()=>{if(ci.value){const n=iso(new Date(new Date(ci.value).getTime()+day));co.min=n;if(!co.value||co.value<n)co.value=n}links()};co.onchange=()=>links();gs.onchange=()=>{bf();links()};
const bfc=$('bfc');function bf(){$('bfp').textContent=bfc.checked?'+ $'+(10*gs.value):''}
bfc.onchange=()=>{bf();links()};
function links(){const t=T[L];let m=t.m0;
  if(ci.value)m+='\n'+t.mci+': '+ci.value;if(co.value)m+='\n'+t.mco+': '+co.value;m+='\n'+t.mg+': '+gs.value;if(bfc.checked)m+='\n'+t.mb+': '+t.yes;
  document.querySelectorAll('.wal').forEach(a=>{let x=m;if(a.id==='cb')x+='\n'+t.ma+': '+t[apts[cur].t];a.href='https://wa.me/201556557076?text='+encodeURIComponent(x)})}

function setLang(l){L=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[l][e.dataset.t]);
  $('lang').textContent=l==='ar'?'English':'عربي';fillCard();links();drawFly()}
$('lang').onclick=()=>setLang(L==='en'?'ar':'en');

const fab=$('fab');let tick=false;
function frame(){tick=false;drawFly();
  const er=document.querySelector('.end').getBoundingClientRect(),ar=$('apt').getBoundingClientRect(),mid=innerHeight*.6;
  fab.classList.toggle('show',scrollY>innerHeight*.7&&!(ar.top<mid&&ar.bottom>mid)&&er.top>innerHeight*.75)}
addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(frame)}},{passive:true});
addEventListener('resize',frame);setLang(/^ar/.test(navigator.language)?'ar':'en');frame();
</script>
